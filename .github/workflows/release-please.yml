name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Only run when release-please created or updated a PR.
      # Converts the default changelog format to R package NEWS.md conventions:
      #   ## [0.2.0](link) (date)  →  # shinyds 0.2.0
      #   ### New features          →  ## New features
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.pr }}
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reformat NEWS.md for R package conventions
        if: ${{ steps.release.outputs.pr }}
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          PR_BRANCH=$(echo "$PR_JSON" | jq -r '.headBranchName')
          git fetch origin "$PR_BRANCH"
          git checkout "$PR_BRANCH"

          # ## [0.2.0](https://…) (2025-01-01)  →  # shinyds 0.2.0
          sed -i -E \ 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\]\([^)]+\) \([0-9-]+\)/# shinyds \1/' \ NEWS.md 

          # ### New features  →  ## New features
          sed -i 's/^### /## /' NEWS.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NEWS.md
          git diff --staged --quiet || \
            git commit -m "style: reformat NEWS.md for R package conventions"
          git push origin "$PR_BRANCH"
