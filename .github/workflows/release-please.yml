name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.pr }}
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update NEWS.md from CHANGELOG.md
        if: ${{ steps.release.outputs.pr }}
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          PR_BRANCH=$(echo "$PR_JSON" | jq -r '.headBranchName')
          git fetch origin "$PR_BRANCH"
          git checkout "$PR_BRANCH"

          python3 - <<'EOF'
          import re, sys
          from pathlib import Path

          pkg = Path("DESCRIPTION").read_text()
          pkg = re.search(r"^Package:\s*(\S+)", pkg, re.MULTILINE).group(1)

          changelog = Path("CHANGELOG.md").read_text()

          # Extract the latest entry (first ## [...] block)
          m = re.search(
              r"^## \[([^\]]+)\][^\n]*\n(.*?)(?=^## \[|\Z)",
              changelog, re.MULTILINE | re.DOTALL
          )
          if not m:
              sys.exit(0)

          version, body = m.group(1), m.group(2).strip()

          # ### Section  →  ## Section
          body = re.sub(r"^### ", "## ", body, flags=re.MULTILINE)

          new_entry = f"# {pkg} {version}\n\n{body}\n"

          news = Path("NEWS.md")
          existing = news.read_text() if news.exists() else ""

          if f"# {pkg} {version}" in existing:
              sys.exit(0)

          news.write_text(new_entry + "\n" + existing)
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NEWS.md
          git diff --staged --quiet || \
            git commit -m "style: update NEWS.md from CHANGELOG.md"
          git push origin "$PR_BRANCH"
