name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "R/**"
      - "inst/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
      - name: Install
        uses: posit-dev/setup-air@v1

      - name: Check
        run: air format . --check
  
      - name: Setup jarl
        uses: etiennebacher/setup-jarl@v0.1.1

      - name: Run jarl lint
        run: jarl check .
