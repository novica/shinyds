name: Update Designsystemet components

on:
  # Check daily for a new upstream release. Upstream does not notify us, so we poll.
  schedule:
    - cron: "0 5 * * *"

  # Trigger manually from the Actions tab. Leave the version blank to use the
  # latest upstream release.
  workflow_dispatch:
    inputs:
      designsystemet_version:
        description: "Designsystemet version to build against (e.g. 1.22.0). Blank = latest release."
        required: false
        type: string

jobs:
  check:
    name: Check for new release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      current: ${{ steps.version.outputs.current }}
      target: ${{ steps.version.outputs.target }}
      skip: ${{ steps.version.outputs.skip }}
      commit_type: ${{ steps.version.outputs.commit_type }}

    steps:
      - name: Checkout shinyds
        uses: actions/checkout@v7

      - name: Resolve versions
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.designsystemet_version }}
        run: |
          CURRENT=$(grep -m1 -oP 'version = "\K[0-9.]+(?=")' R/ds-dependencies.R)
          if [ -n "$INPUT_VERSION" ]; then
            TARGET="${INPUT_VERSION#v}"
          else
            TARGET=$(gh api repos/digdir/designsystemet/releases/latest --jq '.tag_name')
            TARGET="${TARGET#v}"
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Bundled: $CURRENT, target: $TARGET"

          # Mirror the upstream bump for release-please: an upstream patch
          # release gives fix:, a minor or major release gives feat:.
          if [ "$(echo "$CURRENT" | cut -d. -f1,2)" = "$(echo "$TARGET" | cut -d. -f1,2)" ]; then
            echo "commit_type=fix" >> "$GITHUB_OUTPUT"
          else
            echo "commit_type=feat" >> "$GITHUB_OUTPUT"
          fi

          BRANCH="auto/update-designsystemet-${TARGET}"
          if [ "$CURRENT" = "$TARGET" ]; then
            echo "Already on $TARGET, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && \
               git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch $BRANCH already exists (PR pending), nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    name: Update assets and open PR
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      CURRENT: ${{ needs.check.outputs.current }}
      VERSION: ${{ needs.check.outputs.target }}

    steps:
      - name: Checkout shinyds
        uses: actions/checkout@v7
        with:
          path: shinyds

      - name: Checkout designsystemet upstream
        uses: actions/checkout@v7
        with:
          repository: digdir/designsystemet
          ref: "v${{ needs.check.outputs.target }}"
          path: designsystemet

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Build designsystemet
        working-directory: designsystemet
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Copy assets
        run: |
          mkdir -p shinyds/inst/www/css shinyds/inst/www/js
          # Theme must be prepended to component CSS — in 1.15.0 the theme layer
          # was extracted to a separate file and is no longer bundled in index.css.
          cat designsystemet/packages/css/dist/theme/designsystemet.css \
              designsystemet/packages/css/dist/src/index.css \
              > shinyds/inst/www/css/designsystemet.min.css
          cp designsystemet/packages/web/dist/umd/index.js \
             shinyds/inst/www/js/designsystemet-web.umd.js

      # Collect release notes for every release after the bundled version up to
      # and including the target, so skipped versions are not missed.
      - name: Build PR body with upstream release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }

          VERSIONS=$(gh api "repos/digdir/designsystemet/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | while read -r v; do
                if newer "$v" "$CURRENT" && ! newer "$v" "$VERSION"; then echo "$v"; fi
              done | sort -rV)

          {
            echo "Automated update from Designsystemet \`$CURRENT\` to \`$VERSION\`."
            echo
            echo "## What changed"
            echo "- CSS and JS assets copied from upstream \`v$VERSION\`"
            echo "- Version strings bumped in \`R/ds-dependencies.R\`, \`README.md\`, and \`UPDATING.md\`"
            echo
            echo "## Checklist"
            echo "- [ ] Review release notes below for markup/API changes to existing R wrappers and new components (see \`UPDATING.md\` step 3)"
            echo "- [ ] Fix affected wrappers on this branch"
            echo "- [ ] CI checks pass"
            echo
            echo "## Upstream release notes"
            for v in $VERSIONS; do
              echo
              echo "### v$v"
              echo
              gh api "repos/digdir/designsystemet/releases/tags/v$v" --jq '.body' \
                || echo "_Release notes not available._"
            done
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Bump version strings
        working-directory: shinyds
        run: |
          # ds-dependencies.R — both htmlDependency version strings
          sed -i "s/version = \"[0-9.]*\"/version = \"${VERSION}\"/g" R/ds-dependencies.R
          # UPDATING.md current version line
          sed -i "s/^Current bundled version: \*\*[0-9.]*\*\*/Current bundled version: **${VERSION}**/" UPDATING.md
          # README badge
          sed -i "s/Designsystemet-[0-9.]*-blue/Designsystemet-${VERSION}-blue/" README.md

      # Tests are not run here: R CMD check runs on the PR, including the
      # shinytest2 browser tests. PRs opened with the default GITHUB_TOKEN do
      # not trigger other workflows, so the SHINYDS_UPDATE_PR_TOKEN secret
      # (fine-grained PAT with contents + pull-requests write) is used instead.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          path: shinyds
          token: ${{ secrets.SHINYDS_UPDATE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: "auto/update-designsystemet-${{ needs.check.outputs.target }}"
          commit-message: |
            ${{ needs.check.outputs.commit_type }}: update Designsystemet to ${{ needs.check.outputs.target }}

            Copied CSS and JS assets from the upstream build and bumped version strings.
          title: "${{ needs.check.outputs.commit_type }}: update Designsystemet to ${{ needs.check.outputs.target }}"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: dependencies,automated
